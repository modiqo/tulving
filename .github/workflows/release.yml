# Build release binaries on a version tag and attach them to a GitHub
# release. The homebrew tap and install.sh both download these
# artifacts, named tulving-<tag>-<target>.tar.gz.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p tulving-cli
      - name: Test
        # Cross-compiled x86_64 binaries run under Rosetta on arm runners.
        run: cargo test --release --target ${{ matrix.target }}
      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf tulving-${{ github.ref_name }}-${{ matrix.target }}.tar.gz tulving
          shasum -a 256 tulving-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
      - uses: softprops/action-gh-release@v2
        with:
          files: target/${{ matrix.target }}/release/tulving-${{ github.ref_name }}-${{ matrix.target }}.tar.gz

  checks:
    name: lint wall
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets
      - uses: EmbarkStudios/cargo-deny-action@v2
