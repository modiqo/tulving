[workspace]
resolver = "2"
members = ["crates/tulving-core", "crates/tulving-cli", "crates/tulving-mcp"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/tulving/tulving"

[workspace.lints.rust]
missing_docs = "deny"
dead_code = "deny"
unsafe_code = "forbid"
unused_must_use = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
string_slice = "deny"
missing_docs_in_private_items = "allow"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
croner = "2"
jaq-core = "2"
jaq-json = { version = "1", features = ["serde_json"] }
jaq-std = "2"
toml = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
